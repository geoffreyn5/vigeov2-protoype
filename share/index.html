<script>
(function(){
  const html = document.documentElement;
  const params = new URLSearchParams(location.search);
  const mq = window.matchMedia("(max-width: 540px)");
  const standaloneMq = window.matchMedia("(display-mode: standalone), (display-mode: fullscreen), (display-mode: minimal-ui)");
  function isStandalone(){
    return window.navigator.standalone === true || standaloneMq.matches;
  }
  function apply(){
    const standalone = isStandalone();
    const app = params.has("app") || mq.matches || standalone;
    html.classList.toggle("is-embed", window.parent !== window);
    html.classList.toggle("is-app", app);
    html.classList.toggle("is-standalone", standalone);
  }
  apply();
  mq.addEventListener("change", apply);
  standaloneMq.addEventListener("change", apply);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --desk:#0e1218;
    --ink:#f6f7fb;
    --mut:#9aa3b2;
    --line:rgba(255,255,255,.1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;color:var(--ink);font-family:"Outfit",system-ui,sans-serif;
    background:
      radial-gradient(900px 480px at 12% -8%, rgba(255,120,70,.16) 0%, transparent 50%),
      radial-gradient(800px 420px at 88% 0%, rgba(80,220,160,.1) 0%, transparent 48%),
      var(--desk);
    padding:28px 18px 64px;
    display:flex;flex-direction:column;align-items:center;
  }
  button,a{font:inherit;color:inherit}
  .page{max-width:720px;width:100%}
  .stage{display:flex;justify-content:center}
  html.is-embed, html.is-embed body{
    height:100%;min-height:100%;overflow:hidden;
  }
  html.is-embed body{
    padding:0;justify-content:center;
    background:var(--desk);
  }
  html.is-embed .page{
    width:auto;max-width:none;height:100%;
    display:flex;align-items:center;justify-content:center;
  }
  html.is-embed .stage{margin:0}
  html.is-embed .phone{
    width:min(393px, calc(100vw - 32px), calc((100dvh - 32px) * 393 / 852));
  }
  html.is-app, html.is-app body{
    height:100%;min-height:100%;min-height:100dvh;overflow:hidden;
  }
  html.is-app body{
    padding:0;
    background:#000;
  }
  html.is-app .page,
  html.is-app .stage{
    width:100%;height:100%;max-width:none;margin:0;
  }
  html.is-app .phone{
    width:100%;height:100%;max-width:none;aspect-ratio:auto;
    border:0;border-radius:0;box-shadow:none;
  }
  @media (max-width:540px){
    html.is-app .page,
    html.is-app .stage,
    html.is-app .phone{
      position:fixed;inset:0;
    }
  }
  html.is-standalone .page,
  html.is-standalone .stage,
  html.is-standalone .phone{
    position:fixed;inset:0;
    width:100%;height:100%;max-width:none;margin:0;
    border:0;border-radius:0;box-shadow:none;aspect-ratio:auto;
  }
  html.is-standalone, html.is-standalone body{
    height:100%;min-height:100dvh;overflow:hidden;
  }
  html.is-standalone body{padding:0;background:#000}
  @media (min-width:541px){
    html.is-app:not(.is-standalone) body{padding:0;background:#000}
    html.is-app:not(.is-standalone) .page,
    html.is-app:not(.is-standalone) .stage{position:relative;inset:auto}
    html.is-app:not(.is-standalone) .phone{
      position:relative;
      width:min(100vw, calc(100dvh * 393 / 852));
      height:100%;
    }
  }

  .phone{
    width:min(100%,393px);aspect-ratio:393/852;border-radius:42px;overflow:hidden;
    position:relative;border:5px solid #050505;
    box-shadow:0 24px 56px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.06);
    background:#000;isolation:isolate;
  }
  .phone iframe{
    position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;
    opacity:0;pointer-events:none;z-index:0;
  }
  .phone iframe.is-on{opacity:1;pointer-events:auto;z-index:1}

  html.is-app, html.is-app body{
    display:block !important;
    width:100% !important;
    height:100% !important;
    min-height:100dvh !important;
    min-height:100lvh !important;
    padding:0 !important;
    margin:0 !important;
    overflow:hidden !important;
    align-items:stretch !important;
    justify-content:flex-start !important;
  }
  html.is-app .page,
  html.is-app .stage,
  html.is-app .phone{
    display:block !important;
    position:fixed !important;
    inset:0 !important;
    width:100% !important;
    height:100% !important;
    max-width:none !important;
    max-height:none !important;
    aspect-ratio:auto !important;
    margin:0 !important;
    border:0 !important;
    border-radius:0 !important;
    box-shadow:none !important;
  }
  html.is-app .phone iframe{
    position:absolute !important;
    inset:0 !important;
    width:100% !important;
    height:100% !important;
  }

  /* Loading screen.
     This prototype is run in moderated user tests, so it loads everything up
     front: a participant should never be the one waiting on a detail page.
     It holds until every screen reports warm, with a hard cap so a slow
     network ends the wait rather than the session. */
  .boot{
    position:fixed;inset:0;z-index:999;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
    background:
      radial-gradient(120% 70% at 8% -10%, rgba(255,90,70,.22) 0%, transparent 42%),
      radial-gradient(90% 50% at 100% 8%, rgba(180,80,220,.16) 0%, transparent 46%),
      #000;
    color:#fff;font-family:"Inter",system-ui,sans-serif;
    transition:opacity .45s ease, visibility 0s linear .45s;
  }
  .boot.is-done{opacity:0;visibility:hidden;pointer-events:none}
  .boot-mark{
    font-size:30px;font-weight:800;letter-spacing:-.04em;
  }
  .boot-sub{
    margin-top:8px;font-size:13.5px;font-weight:500;color:rgba(255,255,255,.55);
  }
  .boot-track{
    margin-top:28px;width:min(62vw,220px);height:3px;border-radius:999px;
    background:rgba(255,255,255,.14);overflow:hidden;
  }
  .boot-fill{
    display:block;height:100%;width:0%;border-radius:inherit;
    background:linear-gradient(90deg, #ffec8c 0%, #ff5a46 60%, #ff2850 100%);
    transition:width .3s cubic-bezier(.22,.82,.28,1);
  }
  @media (prefers-reduced-motion:reduce){
    .boot,.boot-fill{transition:none}
  }

<body>
<div class="boot" id="boot" role="status" aria-live="polite">
  <div class="boot-mark">Alfora</div>
  <div class="boot-sub" id="bootSub">Getting everything ready…</div>
  <div class="boot-track"><i class="boot-fill" id="bootFill"></i></div>
</div>
<div class="page">
  <div class="stage">
    <div class="phone" id="phone">
      <iframe data-app="home" class="is-on" title="Home" src="ah-gummy-ask-carousel.html?app=1&v=sep1j" allow="autoplay; encrypted-media"></iframe>
      <iframe data-app="top10" title="Top 10" src="ah-gummy-ask-carousel.html?app=1&top10=1&v=sep1j" allow="autoplay; encrypted-media"></iframe>
      <iframe data-app="stuff" title="My Stuff" src="ah-gummy-my-stuff.html?app=1&v=sep1e" allow="autoplay; encrypted-media"></iframe>

    </div>
  </div>
</div>
<script>
function screenFor(data){
  const id = String(data?.id || "");
  const path = String(data?.href || "").split("?")[0];
  const href = String(data?.href || "");
  if (id === "gummy-shop" || path.includes("shop")) return "shop";
  if (id === "gummy-search" || path.includes("search")) return "search";
  if (id === "gummy-following" || path.includes("following")) return "follow";
  if (id === "gummy-my-stuff" || path.includes("my-stuff")) return "stuff";
  if (id === "gummy-top10" || data?.view === "top10" || href.includes("top10=1")) return "top10";
  return "home";
}
function ping(frame, type, extra){
  try { frame.contentWindow.postMessage({type, ...(extra || {})}, "*"); } catch (_) {}
}
function muteDocs(root){
  if (!root) return;
  try {
    root.querySelectorAll("video").forEach(v => {
      v.muted = true;
      v.volume = 0;
      v.pause();
    });
    root.querySelectorAll("iframe").forEach(f => {
      try { muteDocs(f.contentDocument); } catch (_) {}
    });
  } catch (_) {}
}
function muteFrame(frame){
  ping(frame, "app-pause");
  try { muteDocs(frame.contentDocument); } catch (_) {}
}
function readSafe(){
  const el = document.createElement("div");
  el.style.cssText = "position:fixed;inset:0 auto auto 0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)";
  document.body.appendChild(el);
  const cs = getComputedStyle(el);
  const safe = {top:cs.paddingTop, right:cs.paddingRight, bottom:cs.paddingBottom, left:cs.paddingLeft};
  el.remove();
  return safe;
}
function paintSafe(frame){
  const safe = readSafe();
  try{
    const root = frame.contentDocument && frame.contentDocument.documentElement;
    if (root){
      root.style.setProperty("--app-safe-top", safe.top);
      root.style.setProperty("--app-safe-right", safe.right);
      root.style.setProperty("--app-safe-bottom", safe.bottom);
      root.style.setProperty("--app-safe-left", safe.left);
    }
  }catch(_){}
  ping(frame, "app-safe", safe);
}
function paintAllSafe(){
  document.querySelectorAll("[data-app]").forEach(paintSafe);
}
function show(key){
  document.querySelectorAll("[data-app]").forEach(frame => {
    const on = frame.dataset.app === key;
    const was = frame.classList.contains("is-on");
    frame.classList.toggle("is-on", on);
    frame.inert = !on;
    if (on && !was) ping(frame, "app-resume");
    if (!on && was) muteFrame(frame);
  });
}
document.querySelectorAll("[data-app]").forEach(frame => {
  frame.inert = !frame.classList.contains("is-on");
  frame.addEventListener("load", () => {
    paintSafe(frame);
    if (!frame.classList.contains("is-on")) muteFrame(frame);
  });
});
paintAllSafe();
function muteAll(){
  document.querySelectorAll("[data-app]").forEach(muteFrame);
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) muteAll();
  else document.querySelectorAll("[data-app].is-on").forEach(frame => ping(frame, "app-resume"));
});
window.addEventListener("pagehide", muteAll);
window.addEventListener("freeze", muteAll);
window.addEventListener("resize", paintAllSafe);
window.addEventListener("orientationchange", paintAllSafe);
if (window.visualViewport) visualViewport.addEventListener("resize", paintAllSafe);
window.addEventListener("message", e => {
  const d = e.data;
  if (!d || typeof d !== "object") return;
  if (d.type !== "app-go" && d.type !== "playground-go") return;
  if (!d.href && !d.id) return;
  const to = screenFor(d);
  show(to);
  // the frames stay loaded, so a reel has to be handed over rather than
  // travelling in the URL
  if (d.reel) {
    const frame = document.querySelector(`iframe[data-app="${to}"]`);
    frame?.contentWindow?.postMessage({ type: "app-reel", reel: d.reel }, "*");
  }
});
// The keyboard only shrinks the top-level visual viewport; an iframe's own
// never reports it on iOS. So measure it here and hand it to the frame on
// screen, which docks its input above it.
(function publishKeyboardInset(){
  const vv = window.visualViewport;
  if (!vv) return;
  let last = -1;
  const push = () => {
    const kb = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
    if (kb === last) return;
    last = kb;
    document.querySelectorAll("iframe[data-app]").forEach(f => ping(f, "app-kb", { kb }));
  };
  vv.addEventListener("resize", push);
  vv.addEventListener("scroll", push);
  window.addEventListener("orientationchange", () => setTimeout(push, 250));
  push();
})();

// Holding the loading screen until the screens report themselves warm.
//
// Each frame posts {done, total} as it works through its own titles. Totals
// arrive in batches, so the bar is clamped to never run backwards -- a
// participant watching it should see one steady fill, not a number arguing
// with itself.
(function bootGate(){
  const el = document.getElementById("boot");
  const fill = document.getElementById("bootFill");
  const sub = document.getElementById("bootSub");
  if (!el) return;

  const frames = new Map();
  let shown = 0, settled = false;
  const START = performance.now();
  const FLOOR = 900;      // never flash past; it reads as a glitch
  // Generous, because cutting off early is the worse failure: the participant
  // then meets exactly the cold screens this is here to prevent. It is a
  // backstop for a broken network, not a schedule.
  const CAP = 60000;

  const finish = (why) => {
    if (settled) return;
    settled = true;
    fill.style.width = "100%";
    if (why === "cap") sub.textContent = "Ready";
    const wait = Math.max(0, FLOOR - (performance.now() - START));
    setTimeout(() => el.classList.add("is-done"), wait + 220);
  };

  const paint = () => {
    let done = 0, total = 0;
    frames.forEach(v => { done += v.done; total += v.total; });
    if (!total) return;
    // the bar only ever moves forward, and stops short of full until the work
    // actually is
    const pct = Math.min(97, Math.round((done / total) * 100));
    if (pct > shown) {
      shown = pct;
      fill.style.width = pct + "%";
      // the count is for whoever is setting the test up, not the participant
      sub.textContent = `Getting everything ready… ${done} of ${total}`;
    }
    const ready = [...frames.values()].every(v => v.total > 0 && v.done >= v.total);
    if (ready && performance.now() - START > FLOOR) finish("warm");
  };

  window.addEventListener("message", e => {
    const d = e.data;
    if (!d || d.type !== "warm" || typeof d.total !== "number") return;
    const key = [...document.querySelectorAll("iframe[data-app]")]
      .find(f => f.contentWindow === e.source)?.dataset.app || "other";
    frames.set(key, { done: d.done, total: d.total });
    paint();
  });

  setTimeout(() => finish("cap"), CAP);
  // nothing reported at all -- an older build, or every frame blocked
  setTimeout(() => { if (!frames.size) finish("cap"); }, 6000);
})();

if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register("./sw.js");
}
</script>
</body>
